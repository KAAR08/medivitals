version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories: ['/services/telemetry-engine', '/services/biometric-simulator']
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/services/telemetry-engine', '/services/biometric-simulator', '/services/identity-service']
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /services/identity-service
    schedule:
      interval: weekly
