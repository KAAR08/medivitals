name: Backend services

on:
  push:
    branches: ['**'] # every branch: feature branches are tested before their pull request
    paths: ['services/**', '.github/workflows/services.yml']
  pull_request:
    paths: ['services/**', '.github/workflows/services.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [telemetry-engine, biometric-simulator]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - run: pip install -r requirements-dev.txt pip-audit

      - name: Lint (incl. bandit security rules)
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict

      - name: Build container image
        run: docker build -t medvitals/${{ matrix.service }}:ci .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned to a commit
        with:
          image-ref: medvitals/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  identity:
    name: identity-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/identity-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/identity-service/package-lock.json

      - run: npm ci

      - name: Lint (incl. eslint-plugin-security)
        run: npx eslint . --max-warnings 0

      - name: Tests
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build container image
        run: docker build -t medvitals/identity-service:ci .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned to a commit
        with:
          image-ref: medvitals/identity-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
