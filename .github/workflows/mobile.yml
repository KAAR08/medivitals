name: Mobile app

on:
  push:
    branches: ['**'] # every branch: feature branches are tested before their pull request
    paths: ['lib/**', 'test/**', 'integration_test/**', 'assets/**', 'android/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['lib/**', 'test/**', 'integration_test/**', 'assets/**', 'android/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

      - name: Build release APK (mock backend)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: medvitals-link-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
