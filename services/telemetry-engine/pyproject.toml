[project]
name = "medvitals-telemetry-engine"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F/W: correctness, I: import order, B: bugbear, UP: modern syntax,
# S: flake8-bandit security checks (SAST), ASYNC: asyncio pitfalls.
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fixture secrets are fine in tests
