name: medivitallink
description: "MedVitals Link — Premium Telehealth Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.4.1
  dio: ^5.4.3
  web_socket_channel: ^3.0.1
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  go_router: ^15.1.2
  flutter_webrtc: 0.12.11
  audioplayers: 6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/sounds/alarm_high.wav

  fonts:
    - family: Inter # assets/fonts/OFL.txt
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# App icon for every platform: `python scripts/make_icon.py` draws the
# artwork, `dart run flutter_launcher_icons` generates the platform files.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#1A5F73"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1A5F73"
    theme_color: "#1A5F73"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
